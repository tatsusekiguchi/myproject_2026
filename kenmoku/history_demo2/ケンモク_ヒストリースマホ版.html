<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E8E4DC;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;display:flex;justify-content:center;padding:24px 0 32px}

.phone-frame{width:320px;background:#F6F3EE;border-radius:28px;overflow:hidden;border:6px solid #2E4A34}
.phone-notch{width:80px;height:18px;background:#2E4A34;border-radius:0 0 12px 12px;margin:0 auto}

.ph{text-align:center;padding:20px 18px 10px}
.ph-eyebrow{font-size:9px;letter-spacing:0.18em;color:#7A9982;margin-bottom:6px}
.ph-title{font-size:16px;font-weight:500;color:#2A3828;font-family:'Hiragino Mincho ProN','Georgia',serif;line-height:1.4;margin-bottom:4px}
.ph-sub{font-size:10px;color:#7A746E;line-height:1.6}

.ring-area{position:relative;width:200px;margin:8px auto 0;aspect-ratio:1}
.ring-area svg{width:100%;height:100%}

.tl-dots{display:flex;align-items:flex-start;justify-content:center;gap:0;padding:10px 8px 4px;position:relative}
.tl-dots::before{content:'';position:absolute;top:18px;left:16px;right:16px;height:1px;background:#C8D0C8;z-index:0}
.tl-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;z-index:1}
.tl-dot{width:9px;height:9px;border-radius:50%;background:#C8D0C8;transition:all 0.25s;flex-shrink:0}
.tl-item.active .tl-dot{background:#A86A52;transform:scale(1.4)}
.tl-year{font-size:7px;color:#9A9490;white-space:nowrap;line-height:1.3;text-align:center}
.tl-item.active .tl-year{color:#A86A52;font-weight:500}

.hint-text{text-align:center;font-size:9px;color:#B0A8A0;margin:2px 0 8px;letter-spacing:0.04em}

.card-area{margin:0 12px 12px;background:#FDFBF8;border:0.5px solid #D8D0C4;border-radius:10px;padding:14px 15px;min-height:140px;transition:opacity 0.2s}
.card-year-tag{display:inline-block;font-size:8px;font-weight:500;letter-spacing:0.1em;color:#4A6450;background:#E8F0E8;padding:2px 8px;border-radius:20px;margin-bottom:7px}
.card-title{font-size:13px;font-weight:500;color:#2A3828;font-family:'Hiragino Mincho ProN','Georgia',serif;line-height:1.4;margin-bottom:7px}
.card-body{font-size:10px;color:#5A534C;line-height:1.8;margin-bottom:8px}
.card-quote{background:#F2EEE8;border-left:2px solid #4A6450;padding:7px 10px;border-radius:0 5px 5px 0;margin-bottom:7px}
.card-quote p{font-size:9.5px;color:#3A4A38;line-height:1.75;font-family:'Hiragino Mincho ProN','Georgia',serif}
.card-stat{font-size:9px;color:#7A9982}

.future-band{background:#2E4A34;padding:16px 18px;text-align:center}
.future-text{font-size:11px;color:#F0EDE6;font-family:'Hiragino Mincho ProN','Georgia',serif;line-height:1.9}
.future-sub{font-size:8px;color:#7A9A82;margin-top:4px;letter-spacing:0.05em}
.phone-home{width:80px;height:4px;background:#2A382840;border-radius:2px;margin:8px auto 10px}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-body">

    <div class="ph">
      <p class="ph-eyebrow">HISTORY — 会社の歩み</p>
      <p class="ph-title">根を張り続けた、<br>20年の年輪。</p>
      <p class="ph-sub">年号をタップして歩みをご覧ください</p>
    </div>

    <div class="ring-area">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="mSvg">
        <!-- 未来点線 -->
        <circle cx="100" cy="100" r="95" fill="none" stroke="#B8C8B8" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
        <!-- 8本の年輪（外→内） -->
        <circle class="mr" data-id="2026" cx="100" cy="100" r="85" fill="none" stroke="#4A6450" stroke-width="6" opacity="0.11"/>
        <circle class="mr" data-id="2025" cx="100" cy="100" r="73" fill="none" stroke="#4A6450" stroke-width="6" opacity="0.17"/>
        <circle class="mr" data-id="2023" cx="100" cy="100" r="61" fill="none" stroke="#4A6450" stroke-width="6" opacity="0.24"/>
        <circle class="mr" data-id="2018" cx="100" cy="100" r="50" fill="none" stroke="#4A6450" stroke-width="5" opacity="0.32"/>
        <circle class="mr" data-id="2015" cx="100" cy="100" r="39" fill="none" stroke="#4A6450" stroke-width="5" opacity="0.41"/>
        <circle class="mr" data-id="2013" cx="100" cy="100" r="29" fill="none" stroke="#4A6450" stroke-width="5" opacity="0.52"/>
        <circle class="mr" data-id="2010" cx="100" cy="100" r="19" fill="none" stroke="#4A6450" stroke-width="4" opacity="0.64"/>
        <!-- 中心（創業） -->
        <circle class="mr" data-id="2005" cx="100" cy="100" r="9" fill="#4A6450" opacity="0.85"/>
        <text x="100" y="103" text-anchor="middle" font-size="5" fill="#F0EDE6" font-family="sans-serif" style="pointer-events:none">創業</text>
        <!-- アクティブリング -->
        <circle id="mActive" cx="100" cy="100" r="9" fill="none" stroke="#A86A52" stroke-width="2" opacity="1" style="pointer-events:none;transition:r 0.3s"/>
      </svg>
    </div>

    <p class="hint-text">↓ 下の年号をタップ</p>

    <div class="tl-dots" id="mDots">
      <div class="tl-item active" data-id="2005"><div class="tl-dot"></div><span class="tl-year">2005</span></div>
      <div class="tl-item" data-id="2010"><div class="tl-dot"></div><span class="tl-year">2010</span></div>
      <div class="tl-item" data-id="2013"><div class="tl-dot"></div><span class="tl-year">2013</span></div>
      <div class="tl-item" data-id="2015"><div class="tl-dot"></div><span class="tl-year">2015</span></div>
      <div class="tl-item" data-id="2018"><div class="tl-dot"></div><span class="tl-year">2018</span></div>
      <div class="tl-item" data-id="2023"><div class="tl-dot"></div><span class="tl-year">2023</span></div>
      <div class="tl-item" data-id="2025"><div class="tl-dot"></div><span class="tl-year">2025</span></div>
      <div class="tl-item" data-id="2026"><div class="tl-dot"></div><span class="tl-year">現在</span></div>
    </div>

    <div class="card-area" id="mCard">
      <span class="card-year-tag" id="mYear">2005年10月</span>
      <p class="card-title" id="mTitle">高槻の地に、根を下ろす。</p>
      <p class="card-body" id="mBody">大阪府高槻市にて株式会社ケンモクを創業。株式会社ダスキンのフランチャイズ加盟店として、福祉用具のレンタル・販売事業をスタート。</p>
      <div class="card-quote"><p id="mQuote">創業者 上野與一の「ご利用者様に喜んでもらえるお仕事がしたい」——その心から始まりました。</p></div>
      <p class="card-stat" id="mStat"></p>
    </div>

    <div class="future-band">
      <p class="future-text">まだ描かれていない年輪が、<br>これからも積み重なっていく。</p>
      <p class="future-sub">— 代表取締役　上野一憲</p>
    </div>

    <div class="phone-home"></div>
  </div>
</div>

<script>
const mData = {
  '2005':{year:'2005年10月',title:'高槻の地に、根を下ろす。',body:'大阪府高槻市にて株式会社ケンモクを創業。株式会社ダスキンのフランチャイズ加盟店として、福祉用具のレンタル・販売事業をスタート。ダスキンヘルスレント高槻ステーションをオープン。',quote:'創業者 上野與一の「ご利用者様に喜んでもらえるお仕事がしたい」——その心から始まりました。',stat:'',r:9},
  '2010':{year:'2010年6月',title:'箕面へ、根を広げる。',body:'大阪府箕面市にダスキンヘルスレント箕面ステーションを開設。高槻エリアを超え、より広い地域の方々へサービスを届ける体制を整える。',quote:'一つの地域で信頼を積み上げてきたからこそ、次の根を張る場所が見えてきました。',stat:'拠点：高槻・箕面',r:19},
  '2013':{year:'2013年12月',title:'家事代行事業へ、枝を伸ばす。',body:'家事代行サービスを開始。福祉に加え、日常の暮らしそのものを支える事業へと領域を広げる。',quote:'「必要な支えを、必要な人へ。」事業の幅を広げることが、より多くの方への貢献につながると確信しました。',stat:'',r:29},
  '2015':{year:'2015年7月',title:'住まいへ、支えを広げる。',body:'住宅改修・リフォーム事業、株式会社中今を立ち上げ。ご利用者様一人ひとりの身体状況や暮らしに合わせた住環境の整備まで、一貫して支えられる体制を整える。',quote:'「道具だけでなく、暮らしの場所そのものをより安心で快適に。」ご利用者様の声に向き合う中で、住まいまで支えることの必要性を感じました。',stat:'',r:39},
  '2018':{year:'2018年2月',title:'年輪を重ね、新たな地へ。',body:'奈良県生駒市に3店舗目となるダスキンヘルスレント奈良生駒ステーションを開設。より多くのご利用者様や地域の皆様へサービスを届けられる体制を整えました。',quote:'新たな土地でも地域に根を張り、必要とされ続ける存在を目指します。',stat:'拠点：高槻・箕面・奈良生駒',r:50},
  '2023':{year:'2023年10月',title:'幹を太く、品質を育む。',body:'商品管理部を開設。商品のメンテナンス・消毒・品質管理体制を強化し、より清潔で安心・安全な福祉用具を、必要な時に迅速にお届けできる体制を構築しました。',quote:'見えないところにこそ、品質へのこだわりがあります。一つひとつの商品と真摯に向き合い、サービスを支える土台を育ててきました。',stat:'',r:61},
  '2025':{year:'2025年2月',title:'想いをつなぎ、幹を支える。',body:'フロントオフィスを開設。お問い合わせ対応や受発注業務などを担い、お客様やケアマネジャー様、現場スタッフをつなぐ窓口として、より迅速で円滑なサービスを提供できる体制を整えました。',quote:'「バックオフィス」ではなく「フロントオフィス」。お客様との距離を縮め、より身近な存在として寄り添いたいという想いを込めています。',stat:'',r:73},
  '2026':{year:'2026年4月',title:'年輪を重ね、その地に根づく。',body:'奈良県橿原市に4店舗目となるダスキンヘルスレント奈良橿原ステーションを開設。より広いエリアへサービスを届けられる体制を整え、一人でも多くのご利用者様へ迅速できめ細やかな対応を実現しました。',quote:'新たな出店は、店舗数を増やすことが目的ではありません。その地域で信頼を積み重ね、必要とされ続けた結果として、新たな拠点が生まれました。',stat:'拠点：高槻・箕面・奈良生駒・奈良橿原',r:85},
};

const mActive = document.getElementById('mActive');
const mCard   = document.getElementById('mCard');

function mActivate(id) {
  const d = mData[id];
  if(!d) return;
  mActive.setAttribute('r', d.r);
  document.querySelectorAll('.mr').forEach(el=>{
    el.style.stroke  = el.dataset.id===id ? '#A86A52' : '#4A6450';
    el.style.opacity = el.dataset.id===id ? '0.65'    : el.getAttribute('opacity');
  });
  document.querySelectorAll('#mDots .tl-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.id===id);
  });
  mCard.style.opacity='0';
  setTimeout(()=>{
    document.getElementById('mYear').textContent  = d.year;
    document.getElementById('mTitle').textContent = d.title;
    document.getElementById('mBody').textContent  = d.body;
    document.getElementById('mQuote').textContent = d.quote;
    document.getElementById('mStat').textContent  = d.stat;
    mCard.style.opacity='1';
  },150);
}

document.querySelectorAll('#mDots .tl-item').forEach(el=>{
  el.addEventListener('click',()=>mActivate(el.dataset.id));
});
mActivate('2005');
</script>
</body>
</html>
